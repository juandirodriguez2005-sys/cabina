<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabina · Contrata DJs y fotógrafos</title>
<meta name="description" content="La plataforma donde salas y promotores contratan DJs y fotógrafos. Registro gratis, pago seguro y comisión solo cuando se cierra el bolo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: landing de una columna (1180px) / app con barra lateral fija de 248px que en móvil pasa a barra inferior */
:root{
  --bg:#0f0c12; --bg-2:#141018; --surface:#1a1520; --surface-2:#231d2a; --surface-3:#2d2636;
  --line:#2f2838; --line-2:#3d3447;
  --fg:#f4f0f6; --fg-2:#d6cddc; --muted:#9a8fa3;
  --accent:#ffb547; --accent-2:#ff8a3d; --accent-ink:#1d1306;
  --violet:#a594ff;
  --ok:#4fd18b; --warn:#ffb547; --bad:#ff6b7a;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-lg:20px;
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.025em;text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
.muted{color:var(--muted)}
.lbl{font:500 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Botones */
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .15s,box-shadow .15s}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:linear-gradient(180deg,#ffc266,var(--accent));color:var(--accent-ink);box-shadow:0 6px 24px -8px rgba(255,181,71,.6)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 30px -8px rgba(255,181,71,.75)}
.btn.ghost{background:transparent;border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface)}
.btn.lg{padding:15px 24px;font-size:17px;border-radius:13px}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip.dj{background:rgba(255,181,71,.14);color:var(--accent)}
.chip.fotografo{background:rgba(165,148,255,.16);color:#c8bdff}
.chip.ok{background:rgba(79,209,139,.14);color:var(--ok)}
.chip.bad{background:rgba(255,107,122,.14);color:var(--bad)}
.chip.wait{background:rgba(255,181,71,.12);color:var(--warn)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Formularios */
.field{display:grid;gap:7px;min-width:0}
.field>label{font-size:13.5px;color:var(--fg-2);font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
input,select,textarea{background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,181,71,.15)}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form{display:grid;gap:18px}

/* ---------- Landing ---------- */
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(15,12,18,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.lnav .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{font:800 23px/1 var(--display);letter-spacing:-.03em;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:9px}
.logo .mk{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--accent),var(--accent-2),#ff5f8f,var(--violet),var(--accent));display:grid;place-items:center}
.logo .mk::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bg)}
.lnav nav{display:flex;gap:22px;flex:1}
.lnav nav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:15px}
.lnav nav a:hover{color:var(--fg)}
.lnav .acts{display:flex;gap:10px}

.hero{position:relative;overflow:hidden;padding:76px 0 90px}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:780px;height:780px;background:radial-gradient(closest-side,rgba(255,138,61,.20),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;left:-200px;bottom:-300px;width:640px;height:640px;background:radial-gradient(closest-side,rgba(165,148,255,.12),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;font-size:13.5px;color:var(--fg-2)}
.pill b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700}
.hero h1{font-size:clamp(42px,6.4vw,78px);font-weight:800;margin:22px 0 22px;letter-spacing:-.04em;line-height:.98}
.hero h1 .hl{background:linear-gradient(90deg,var(--accent),var(--accent-2) 60%,#ff5f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:19px;color:var(--fg-2);max-width:54ch;line-height:1.55}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0 26px}
.trust{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust svg{color:var(--ok);width:16px;height:16px}

.mock{position:relative;display:grid;gap:14px}
.mcard{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.mcard.tilt{transform:rotate(-1.5deg)}
.mcard.off{margin-left:40px;transform:rotate(1.2deg)}
.mrow{display:flex;align-items:center;gap:12px}
.mav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--display);color:var(--accent-ink);flex:none}
.mbar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.toastmock{position:absolute;right:-8px;bottom:-22px;background:var(--fg);color:var(--bg);padding:11px 15px;border-radius:12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.toastmock svg{color:#14864a}

.band{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
.band .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.band .it{padding:26px 22px;border-left:1px solid var(--line);display:grid;gap:6px}
.band .it:first-child{border-left:0}
.band .it b{font:800 30px/1 var(--display);letter-spacing:-.03em}
.band .it span{color:var(--muted);font-size:14px}

section.s{padding:96px 0}
.s-head{display:grid;gap:14px;max-width:720px;margin-bottom:44px}
.s-head h2{font-size:clamp(32px,4.4vw,50px);font-weight:800;letter-spacing:-.035em}
.s-head p{font-size:18px;color:var(--fg-2)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:30px}
.seg button{border:0;background:none;padding:9px 16px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface-3);color:var(--fg)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;display:grid;gap:12px;align-content:start}
.step .n{font:500 12px var(--mono);color:var(--accent);letter-spacing:.1em}
.step h3{font-size:22px}
.step p{color:var(--muted)}
.step .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.step .ic svg{width:22px;height:22px}

.feed{display:grid;gap:12px;position:relative}
.feed .lock{position:relative}
.feed .lock .ev{filter:blur(5px);opacity:.55;pointer-events:none}
.gate{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.gate .box{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:26px 28px;text-align:center;display:grid;gap:12px;box-shadow:var(--shadow);max-width:440px;margin:0 16px}
.gate .box h3{font-size:24px}

.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.calc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:grid;gap:20px}
.calc-card input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:28px}
.split-bar{display:flex;height:14px;border-radius:99px;overflow:hidden}
.split-bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.split-bar s{background:var(--violet);text-decoration:none}
.kv{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;gap:12px}
.kv b{font-family:var(--display);font-size:20px}
.kv.big b{font-size:44px;color:var(--accent);letter-spacing:-.03em}
.plan{background:linear-gradient(160deg,rgba(255,181,71,.12),transparent 50%),var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:28px;display:grid;gap:18px;align-content:start}
.plan .amt{font:800 64px/1 var(--display);letter-spacing:-.04em}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.plan li{display:flex;gap:10px;align-items:flex-start;color:var(--fg-2)}
.plan li svg{color:var(--ok);margin-top:3px}

.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 24px/1 var(--display);color:var(--muted);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);margin-top:12px;max-width:68ch}

.final{padding:20px 0 100px}
.final .box{background:radial-gradient(600px 300px at 85% 0%,rgba(255,138,61,.25),transparent 70%),radial-gradient(500px 300px at 0% 100%,rgba(165,148,255,.18),transparent 70%),var(--surface);border:1px solid var(--line-2);border-radius:28px;padding:64px 48px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.final h2{font-size:clamp(32px,4.4vw,52px);font-weight:800;letter-spacing:-.035em}
.final .roles{display:grid;gap:10px}
.rolebtn{display:flex;align-items:center;gap:14px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.rolebtn:hover{border-color:var(--accent);transform:translateX(3px)}
.rolebtn .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.rolebtn b{display:block}
.rolebtn small{color:var(--muted);font-size:13px}
.rolebtn .arr{margin-left:auto;color:var(--muted)}
footer.f{border-top:1px solid var(--line);padding:34px 0 50px;color:var(--muted);font-size:14px}
footer.f .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}

/* Tarjeta de bolo (compartida) */
.ev{display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 14px 14px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.ev:hover{border-color:var(--line-2);background:var(--surface-2)}
.date{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:8px 0;text-align:center}
.date b{display:block;font:800 28px/1.05 var(--display)}
.date span{font:500 11px/1.4 var(--mono);text-transform:uppercase;color:var(--accent);letter-spacing:.06em}
.ev .meta{min-width:0;display:grid;gap:5px}
.ev .meta h3{font-size:18px;overflow:hidden;text-overflow:ellipsis}
.ev .meta p{color:var(--muted);font-size:14px}
.ev .meta p svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.price{font:700 21px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;letter-spacing:-.02em}
.price small{display:block;font:500 10.5px/1.7 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.price .lk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:15px}

/* ---------- App ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.side a.logo{padding:4px 10px 22px;font:800 23px/1 var(--display);color:var(--fg);background:none}
.side .sec{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 12px 8px}
.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--fg-2);text-decoration:none;font-weight:500;font-size:15px;position:relative}
.side a:hover{background:var(--surface);color:var(--fg)}
.side a.on{background:var(--surface-2);color:var(--fg)}
.side a.on svg{color:var(--accent)}
.side a .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font:700 11px/1 var(--body);border-radius:99px;padding:3px 7px}
.side .cta{margin:18px 4px 0}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 0;display:flex;gap:10px;align-items:center}
.side .me>div:not(.avatar){min-width:0;flex:1}
.side .me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .me small{color:var(--muted);font-size:12.5px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.main{min-width:0;padding:30px max(20px,env(safe-area-inset-right,0px)) 80px 36px}
.main-in{max-width:1080px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.ph h1{font-size:clamp(28px,3.4vw,36px);font-weight:800}
.ph p{color:var(--muted);margin-top:6px}
.mobtop{display:none}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.kpi .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px;font-weight:500}
.kpi .top svg{width:16px;height:16px}
.kpi b{font:800 32px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.hl{background:linear-gradient(160deg,rgba(255,181,71,.16),transparent 60%),var(--surface);border-color:rgba(255,181,71,.35)}
.kpi.hl b{color:var(--accent)}

.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;gap:16px;align-content:start;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-h h3{font-size:18px}
.panel-h a{font-size:14px;text-decoration:none;font-weight:600}
.stack{display:grid;gap:12px}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.rowi:first-child{border-top:0;padding-top:0}
.rowi .grow{flex:1;min-width:0}
.rowi .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rowi .grow small{color:var(--muted);font-size:13px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font:800 15px var(--display);color:var(--accent);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:30px}
.progress{display:grid;gap:8px}
.progress .bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .4s}
.todo{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);text-decoration:none;color:var(--fg-2);font-size:14.5px;cursor:pointer}
.todo:hover{border-color:var(--line-2)}
.todo .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.todo.done{color:var(--muted);text-decoration:line-through;cursor:default}
.todo.done .ck{background:var(--ok);border-color:var(--ok);color:#06210f}
.todo.done .ck svg{width:13px;height:13px;stroke-width:3}
.todo .arr{margin-left:auto;color:var(--muted)}
.notice{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,181,71,.12),rgba(255,181,71,.04));border:1px solid rgba(255,181,71,.3);margin-bottom:22px;flex-wrap:wrap}
.notice .grow{flex:1;min-width:220px}
.notice b{display:block}
.notice small{color:var(--fg-2)}
.notice svg.i{color:var(--accent);width:22px;height:22px}

.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.toolbar .grow{flex:1;min-width:180px}
.list{display:grid;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:grid;gap:12px;align-content:start;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.person{display:flex;gap:12px;align-items:center;min-width:0}
.person>div{min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;color:var(--fg-2)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:36px 24px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty svg.i{width:30px;height:30px;color:var(--line-2)}

const LOCAL=!/^https:$/.test(location.protocol)&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let pendingBooking=null, pendingOnboard=false;
function openStripe(url){
  if(LOCAL){const w=window.open(url,"_blank");if(!w)location.href=url;else toast("Stripe se ha abierto en otra pestaña. Al terminar, vuelve aquí.");}
  else location.href=url;
}
window.addEventListener("focus",async()=>{
  if(pendingBooking){const id=pendingBooking;try{const r=await callFn("bookings",{action:"verify",booking_id:id});if(r.status==="pagado"){pendingBooking=null;toast("Pago completado. ¡Bolo cerrado!");route();}}catch(_){}}
  else if(pendingOnboard){pendingOnboard=false;route();}
});
const MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=$("#root");
let me=null;
let filters={city:"",role:""}, tfilters={city:"",role:""};
let landingAud="talent";

function h(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const eurc=c=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:c%100?2:0}).format(c/100);
const fdate=d=>new Date(d).toLocaleString("es-ES",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
const fshort=d=>new Date(d).toLocaleDateString("es-ES",{day:"numeric",month:"short"});
const initials=n=>h((n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());
const avatar=(p,cls="")=>`<div class="avatar ${cls}">${p?.avatar_url&&/^https:\/\//.test(p.avatar_url)?`<img src="${h(p.avatar_url)}" alt="">`:initials(p?.display_name)}</div>`;
const chip=r=>`<span class="chip ${h(r)}">${h(ROLES[r]||r)}</span>`;
const stChip=s=>{const m={pendiente:"wait",aceptada:"ok",rechazada:"bad",abierto:"wait",cerrado:"ok",cancelado:"bad",pagado:"ok"};const t={pendiente:"Pendiente",aceptada:"Contratado",rechazada:"Descartada",abierto:"Abierto",cerrado:"Cerrado",cancelado:"Cancelado",pagado:"Pagado"};return `<span class="chip ${m[s]||""}"><span class="dot"></span>${t[s]||h(s)}</span>`;};
function toast(msg,err=false){$$(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast"+(err?" err":"");t.innerHTML=(err?"":I("check"))+h(msg);(document.querySelector("dialog[open]")||document.body).append(t);setTimeout(()=>t.remove(),4000);}
const isTalent=()=>me&&TALENT.includes(me.profile.role);
const isClient=()=>me&&!TALENT.includes(me.profile.role);
const go=(v,id)=>{const n=id?`${v}-${id}`:v; if(location.hash.slice(1)===n) route(); else location.hash=n;};

async function callFn(name,body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(`${SUPABASE_URL}/functions/v1/${name}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:`Bearer ${session?.access_token}`},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Algo ha fallado. Inténtalo de nuevo.");
  return j;
}
async function loadMe(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){me=null;return;}
  const [{data:profile},{data:adm}]=await Promise.all([sb.from("profiles").select("*").eq("id",user.id).single(),sb.rpc("is_admin")]);
  me=profile?{user,profile,admin:adm===true}:null;
}

let reg={step:1,role:null};
function openAuth(mode="reg",role=null){
  reg={step:1,role,mode};
  renderAuth(); if(!$("#authDlg").open) $("#authDlg").showModal();
}
function renderAuth(){
  const b=$("#dlgBody");
  if(reg.mode==="login"){
    b.innerHTML=`<div class="dlg-h"><div><h2 id="dlgTitle">Bienvenido de nuevo</h2><p>Entra para ver tus bolos y tu panel.</p></div><button class="iconbtn" data-close aria-label="Cerrar">${I("x")}</button></div>
    <form class="form" id="loginF" novalidate>
      <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="email" required></div>
      <div class="field"><div class="split"><label for="lPass">Contraseña</label><button type="button" class="linkbtn" data-forgot>¿Olvidaste tu contraseña?</button></div><input id="lPass" type="password" autocomplete="current-password" required></div>
      <button class="btn pri lg block" id="lBtn">Entrar</button>
    </form>
    <div class="switch">¿Aún no tienes cuenta? <button data-goreg>Regístrate gratis</button></div>`;
    $("[data-forgot]",b).onclick=()=>{reg.mode="forgot";reg.email=$("#lEmail").value.trim();renderAuth();};
    $("#loginF").onsubmit=async e=>{e.preventDefault();const btn=$("#lBtn");btn.disabled=true;
      const {error}=await sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});
      btn.disabled=false;
      if(error) return toast(error.message.includes("Invalid")?"Email o contraseña incorrectos.":error.message.includes("confirm")?"Confirma tu email antes de entrar. Revisa tu bandeja.":error.message,true);
      $("#authDlg").close(); await loadMe(); beat(); toast(`Hola, ${me?.profile.display_name||""}`); go("resumen");};
  }else if(reg.mode==="forgot"){
    b.innerHTML=`<div class="dlg-h"><div><h2 id="dlgTitle">Recupera tu contraseña</h2><p>Escribe el email de tu cuenta y te mandamos un enlace para crear una nueva.</p></div><button class="iconbtn" data-close aria-label="Cerrar">${I("x")}</button></div>
    <form class="form" id="fgF" novalidate>
      <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" autocomplete="email" value="${h(reg.email||"")}" required></div>
      <button class="btn pri lg block" id="fBtn">Enviar enlace</button>
    </form>
    <div class="switch">¿Te has acordado? <button data-gologin>Volver a entrar</button></div>`;
    $("#fgF").onsubmit=async e=>{e.preventDefault();const email=$("#fEmail").value.trim();
      if(!/^\S+@\S+\.\S+$/.test(email)) return toast("Ese email no parece válido.",true);
      const btn=$("#fBtn");btn.disabled=true;btn.textContent="Enviando…";
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+"?reset=1"});
      btn.disabled=false;btn.textContent="Enviar enlace";
      if(error) return toast(/rate|limit|seconds/i.test(error.message)?"Has pedido demasiados enlaces. Espera unos minutos y vuelve a intentarlo.":"No hemos podido enviar el email. Inténtalo más tarde.",true);
      b.innerHTML=`<div class="dlg-h"><div><h2 id="dlgTitle">Revisa tu email</h2><p>Si hay una cuenta con <b>${h(email)}</b>, te llegará un enlace para crear una contraseña nueva. Mira también en spam.</p></div><button class="iconbtn" data-close aria-label="Cerrar">${I("x")}</button></div>
        <div class="empty">${I("inbox")}<b>Enlace enviado</b><span>Ábrelo desde este mismo dispositivo. Caduca en una hora.</span></div>
        <button class="btn ghost block" data-gologin>Volver a entrar</button>`;bindDlg();};
  }else if(reg.mode==="newpass"){
    b.innerHTML=`<div class="dlg-h"><div><h2 id="dlgTitle">Crea tu nueva contraseña</h2><p>Elige una contraseña de al menos 8 caracteres.</p></div></div>
    <form class="form" id="npF" novalidate>
      <div class="field"><label for="np1">Nueva contraseña</label><input id="np1" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="np2">Repite la contraseña</label><input id="np2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn pri lg block" id="npBtn">Guardar contraseña</button>
    </form>`;
    $("#npF").onsubmit=async e=>{e.preventDefault();const a=$("#np1").value,c=$("#np2").value;
      if(a.length<8) return toast("La contraseña necesita 8 caracteres o más.",true);
      if(a!==c) return toast("Las dos contraseñas no coinciden.",true);
      const btn=$("#npBtn");btn.disabled=true;
      const {error}=await sb.auth.updateUser({password:a});btn.disabled=false;
      if(error) return toast(/different|same/i.test(error.message)?"La nueva contraseña tiene que ser distinta de la anterior.":"No se ha podido guardar: "+error.message,true);
      $("#authDlg").close(); toast("Contraseña cambiada. ¡Ya estás dentro!"); go("resumen");};
  }else if(reg.step===1){
    b.innerHTML=`<div class="stepper"><i class="on"></i><i></i></div>
    <div class="dlg-h"><div><h2 id="dlgTitle">¿Qué eres?</h2><p>Elige tu perfil. Así te enseñamos lo que te interesa.</p></div><button class="iconbtn" data-close aria-label="Cerrar">${I("x")}</button></div>
    <div class="roles4" role="radiogroup" aria-label="Tipo de cuenta">${Object.entries(ROLE_INFO).map(([k,r])=>`
      <button type="button" class="rolec${reg.role===k?" on":""}" role="radio" aria-checked="${reg.role===k}" data-role="${k}">
        <span class="tick">${I("check")}</span><span class="ic">${I(r.icon)}</span><b>${r.t}</b><small>${r.d}</small></button>`).join("")}</div>
    <button class="btn pri lg block" id="r1Next" ${reg.role?"":"disabled"}>Continuar ${I("arr")}</button>
    <div class="switch">¿Ya tienes cuenta? <button data-gologin>Entrar</button></div>`;
    $$("[data-role]",b).forEach(x=>x.onclick=()=>{reg.role=x.dataset.role;renderAuth();});
    $("#r1Next").onclick=()=>{if(reg.role){reg.step=2;renderAuth();}};
  }else{
    const r=ROLE_INFO[reg.role]; const talent=TALENT.includes(reg.role);
    b.innerHTML=`<div class="stepper"><i class="on"></i><i class="on"></i></div>
    <div class="dlg-h"><div><h2 id="dlgTitle">Crea tu cuenta</h2><p>Gratis para siempre. Sin tarjeta.</p></div><button class="iconbtn" data-close aria-label="Cerrar">${I("x")}</button></div>
    <div class="chosen"><span style="color:var(--accent)">${I(r.icon)}</span> Te registras como <b>${r.t}</b><button type="button" id="chg">Cambiar</button></div>
    <form class="form" id="regF" novalidate>
      <div class="grid2">
        <div class="field"><label for="rName">${talent?"Nombre artístico":reg.role==="discoteca"?"Nombre de la sala":"Nombre o promotora"}</label><input id="rName" maxlength="80" autocomplete="nickname" required></div>
        <div class="field"><label for="rCity">Ciudad</label><input id="rCity" autocomplete="address-level2" placeholder="Madrid" required></div>
      </div>
      <div class="field"><label for="rEmail">Email</label><input id="rEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="rPass">Contraseña</label><input id="rPass" type="password" autocomplete="new-password" minlength="8" required><span class="hint">Mínimo 8 caracteres.</span></div>
      <label class="check"><input type="checkbox" id="rTerms"> <span>Soy mayor de 18 años y acepto las <a href="#condiciones" target="_blank">condiciones de uso</a> y la <a href="#privacidad" target="_blank">política de privacidad</a>.</span></label>
      <label class="check"><input type="checkbox" id="rMkt"> <span>Quiero recibir por email novedades, bolos destacados y promociones de Cabina. Puedes darte de baja cuando quieras. <em class="muted">(Opcional)</em></span></label>
      <button class="btn pri lg block" id="rBtn">Crear cuenta gratis</button>
      <p class="legal">Registro gratis. Solo se cobra comisión cuando se cierra un bolo.</p>
    </form>`;
    $("#chg").onclick=()=>{reg.step=1;renderAuth();};
    $("#regF").onsubmit=async e=>{e.preventDefault();
      const name=$("#rName").value.trim(),city=$("#rCity").value.trim(),email=$("#rEmail").value.trim(),password=$("#rPass").value;
      if(name.length<2) return toast("Escribe tu nombre (mínimo 2 letras).",true);
      if(!city) return toast("Indica tu ciudad para mostrarte bolos cerca.",true);
      if(!/^\S+@\S+\.\S+$/.test(email)) return toast("Ese email no parece válido.",true);
      if(password.length<8) return toast("La contraseña necesita 8 caracteres o más.",true);
      if(!$("#rTerms").checked) return toast("Para crear la cuenta tienes que aceptar las condiciones y la política de privacidad.",true);
      const btn=$("#rBtn");btn.disabled=true;btn.textContent="Creando tu cuenta…";
      try{
        const r=await fetch(`${SUPABASE_URL}/functions/v1/registro`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY},body:JSON.stringify({email,password,role:reg.role,display_name:name,city,terms:true,marketing:$("#rMkt").checked})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error||"No se ha podido crear la cuenta.");
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
      }catch(x){btn.disabled=false;btn.textContent="Crear cuenta gratis";return toast(x.message,true);}
      $("#authDlg").close(); await loadMe(); toast("Cuenta creada. ¡Bienvenido a Cabina!"); go("resumen");};
  }
  bindDlg();
  setTimeout(()=>$("input,.rolec",b)?.focus(),30);
}
function bindDlg(){const b=$("#dlgBody");
  $$("[data-close]",b).forEach(x=>x.onclick=()=>$("#authDlg").close());
  $("[data-goreg]",b)?.addEventListener("click",()=>openAuth("reg"));
  $("[data-gologin]",b)?.addEventListener("click",()=>openAuth("login"));}
document.addEventListener("click",e=>{const t=e.target.closest("[data-signup]");if(t){e.preventDefault();openAuth("reg",t.dataset.signup||null);}const l=e.target.closest("[data-login]");if(l){e.preventDefault();openAuth("login");}});

function completeness(){
  const p=me.profile, t=isTalent();
  const items=[
    ["Nombre y ciudad",!!(p.display_name&&p.city),"ajustes"],
    ["Foto de perfil",!!p.avatar_url,"ajustes"],
    [t?"Biografía y estilo":"Descripción de la sala",!!(p.bio&&p.bio.length>20),"ajustes"],
    ["Instagram",!!p.instagram,"ajustes"],
  ];
  if(t){items.push([p.role==="dj"?"Géneros que pinchas":"Especialidades",(p.genres||[]).length>0,"ajustes"]);items.push(["Tarifa orientativa",!!p.rate_eur,"ajustes"]);items.push(["Presskit subido",!!p.presskit_url,"ajustes"]);if(p.role==="dj")items.push(["Rider técnico subido",!!p.rider_url,"ajustes"]);}
  else items.push([p.role==="discoteca"?"Ficha técnica de la cabina":"Dosier subido",!!(p.role==="discoteca"?p.rider_url:p.presskit_url),"ajustes"]);
  return items;
}

function viewAjustes(){

  v.innerHTML=`<div class="ph"><div><h1>Mi perfil</h1><p>Lo que ven ${t?"las salas y promotores":"los artistas"} cuando entran en tu perfil.</p></div><a class="btn ghost" href="#perfil-${p.id}">${I("eye")} Ver perfil público</a></div>

      <div class="field"><label for="pCity">Ciudad</label><input id="pCity" value="${h(p.city||"")}"></div></div>
    ${t?`<div class="grid2"><div class="field"><label for="pRate">Tarifa orientativa por bolo (€)</label><input id="pRate" type="number" min="0" step="10" value="${p.rate_eur??""}"></div>
      <div class="field"><label for="pGenres">${p.role==="dj"?"Géneros":"Especialidades"}</label><input id="pGenres" value="${h((p.genres||[]).join(", "))}" placeholder="${p.role==="dj"?"techno, reggaeton, house":"eventos, retrato, aftermovie"}"><span class="hint">Separados por comas.</span></div></div>`:""}
    <div class="field"><label for="pIg">Instagram</label><input id="pIg" value="${h(p.instagram||"")}" placeholder="@tuusuario"></div>
    <div class="field"><label for="pBio">${t?"Sobre ti":"Sobre la sala o promotora"}</label><textarea id="pBio" maxlength="1500" placeholder="${t?"Tu estilo, dónde has pinchado, qué te diferencia…":"Aforo, estilo musical, equipo de la cabina…"}">${h(p.bio||"")}</textarea></div>
    <div><button class="btn pri">Guardar cambios</button></div></form>
  <div class="panel" style="max-width:780px;margin-top:18px"><div class="panel-h"><h3>Emails de Cabina</h3></div>
    <label class="check"><input type="checkbox" id="mkOpt" disabled> <span>Quiero recibir por email novedades, bolos destacados y promociones de Cabina.</span></label>
    <p class="muted" style="font-size:13px">Los avisos de tu cuenta (como recuperar la contraseña) te llegarán siempre. Esto solo afecta a los emails de promoción.</p></div>
  <form class="panel form" id="pwF" style="max-width:780px;margin-top:18px" novalidate><div class="panel-h"><h3>Contraseña</h3><span class="calc">${h(me.user.email||"")}</span></div>
    <div class="grid2"><div class="field"><label for="pw1">Nueva contraseña</label><input id="pw1" type="password" autocomplete="new-password" minlength="8"></div>
      <div class="field"><label for="pw2">Repite la contraseña</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"></div></div>
    <div><button class="btn ghost" id="pwBtn">Cambiar contraseña</button></div></form>
  <div class="panel" style="max-width:780px;margin-top:18px"><div class="panel-h"><h3>Foto y documentos</h3><span class="calc">PDF o imagen · máx. 15 MB</span></div>
    <div class="docrow">${avatar(p)}<div class="grow"><b>Foto de perfil</b><small>${p.avatar_url?"Subida":"Sin foto"} · JPG o PNG</small></div>
      <label class="btn sm ghost">${I("up")} ${p.avatar_url?"Cambiar":"Subir"}<input type="file" accept="image/*" data-up="avatar" hidden></label></div>
    ${DOCS.map(([k,lt,lo,desc])=>{const url=p[k+"_url"];const label=t?lt:lo;return `<div class="docrow"><span class="docic">${I("file")}</span><div class="grow"><b>${label}</b><small>${url&&/^https:\/\//.test(url)?`<a href="${h(url)}" target="_blank" rel="noopener">Ver archivo</a>`:desc}</small></div>
      ${url?`<button class="iconbtn" data-del="${k}" aria-label="Quitar ${label}">${I("trash")}</button>`:""}
      <label class="btn sm ${url?"ghost":"pri"}">${I("up")} ${url?"Reemplazar":"Subir"}<input type="file" accept="application/pdf,image/*" data-up="${k}" hidden></label></div>`;}).join("")}
  </div>`;
  fillMyStats();
  sb.rpc("my_marketing").then(({data})=>{const c=$("#mkOpt");if(!c)return;c.checked=data===true;c.disabled=false;
    c.onchange=async()=>{c.disabled=true;const {error}=await sb.rpc("set_marketing",{p_opt_in:c.checked});c.disabled=false;
      if(error){c.checked=!c.checked;return toast("No se ha podido guardar.",true);}toast(c.checked?"Te has suscrito a los emails de Cabina":"Te has dado de baja de los emails de Cabina");};});
  $("#pwF").onsubmit=async e=>{e.preventDefault();const a=$("#pw1").value,c=$("#pw2").value;

    if(a!==c) return toast("Las dos contraseñas no coinciden.",true);
    const btn=$("#pwBtn");btn.disabled=true;const {error}=await sb.auth.updateUser({password:a});btn.disabled=false;
    if(error) return toast(/different|same/i.test(error.message)?"La nueva contraseña tiene que ser distinta de la actual.":"No se ha podido cambiar: "+error.message,true);
    $("#pw1").value="";$("#pw2").value="";toast("Contraseña cambiada");};
  $$("[data-up]",v).forEach(inp=>inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    if(f.size>15*1024*1024) return toast("El archivo pesa más de 15 MB.",true);
    const kind=inp.dataset.up; const lbl=inp.parentElement; const old=lbl.innerHTML; lbl.firstChild.textContent=""; lbl.childNodes[1].textContent=" Subiendo…";
    try{const url=await uploadMedia(f,kind);
      const {error}=await sb.from("profiles").update({[kind+"_url"]:url}).eq("id",me.user.id); if(error) throw error;
      await loadMe(); toast(kind==="avatar"?"Foto actualizada":"Archivo subido"); viewAjustes();}
    catch(x){toast("No se ha podido subir: "+x.message,true);lbl.innerHTML=old;}
  });
  $$("[data-del]",v).forEach(b=>b.onclick=async()=>{const k=b.dataset.del;
    const {error}=await sb.from("profiles").update({[k+"_url"]:null}).eq("id",me.user.id);
    if(error) return toast(error.message,true); await loadMe(); toast("Archivo quitado"); viewAjustes();});
  $("#pf").onsubmit=async e=>{e.preventDefault();
    const upd={display_name:$("#pName").value.trim(),city:$("#pCity").value.trim()||null,instagram:$("#pIg").value.trim()||null,bio:$("#pBio").value.trim()||null};
    if(upd.display_name.length<2) return toast("El nombre necesita al menos 2 letras.",true);
    if(t){upd.rate_eur=$("#pRate").value?Math.round(+$("#pRate").value):null;upd.genres=$("#pGenres").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,12);}
    const {error}=await sb.from("profiles").update(upd).eq("id",me.user.id);
    if(error) return toast("No se ha podido guardar: "+error.message,true);
    await loadMe(); toast("Perfil guardado"); viewAjustes();};
}

  v.innerHTML=`<button class="back" onclick="history.back()">${I("left")} Volver</button>
  <div class="ph"><div><h1>Publicar un bolo</h1><p>Gratis. Los artistas de tu ciudad lo verán al momento.</p></div></div>

    <div class="grid2"><div class="field"><label for="eVenue">Sala</label><input id="eVenue" value="${me.profile.role==="discoteca"?h(me.profile.display_name):""}"></div>

      <div class="rowi">${I("shield")}<div class="grow"><b>Pago seguro</b><small>Solo pagas cuando eliges al artista. Publicar no cuesta nada.</small></div></div></div></div>`;
  let need="dj";

  $("#evf").onsubmit=async e=>{e.preventDefault();
    const row={owner_id:me.user.id,title:$("#eTitle").value.trim(),role_needed:need,event_date:new Date($("#eDate").value).toISOString(),venue_name:$("#eVenue").value.trim()||null,city:$("#eCity").value.trim(),budget_eur:$("#eBudget").value?Math.round(+$("#eBudget").value):null,description:$("#eDesc").value.trim()||null};
    if(row.title.length<3) return toast("El título necesita al menos 3 caracteres.",true);
    if(!row.city) return toast("Indica la ciudad del bolo.",true);

async function viewEvento(id){

async function uploadMedia(file,kind){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"bin";
  const path=kind==="post"?`${me.user.id}/posts/${crypto.randomUUID()}.${ext}`:`${me.user.id}/${kind}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from("media").upload(path,file,{upsert:true,contentType:file.type||undefined});
  if(error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

 "condiciones":{t:"Condiciones de uso",html:()=>`

function getConsent(){try{const c=JSON.parse(localStorage.getItem("cabina_cookies")||"null");if(c&&Date.now()-c.at<365*864e5)return c;}catch(_){}return null;}

function closeCookieBanner(){document.getElementById("ckb")?.remove();}
function showCookieBanner(config=false){
  closeCookieBanner(); const cur=getConsent();
  const d=document.createElement("div"); d.id="ckb"; d.className="ckb"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Aviso de cookies");
  d.innerHTML=`<div class="ckb-in">
    <div class="ckb-txt"><b>🍪 Cookies en Cabina</b><p>Usamos cookies técnicas necesarias para que puedas iniciar sesión y pagar de forma segura. No usamos cookies de publicidad. Más información en la <a href="#cookies">política de cookies</a>.</p>
      <div class="ckb-cfg" ${config?"":"hidden"}>
        <label class="ckb-opt"><input type="checkbox" checked disabled> <span><b>Necesarias</b> · sesión, seguridad y pagos. Siempre activas.</span></label>
        <label class="ckb-opt"><input type="checkbox" id="ckAn" ${cur?.analytics?"checked":""}> <span><b>Análisis</b> · estadísticas anónimas de uso para mejorar la web (ahora mismo no se usan).</span></label>
      </div></div>
    <div class="ckb-btns">
      <button class="btn sm ghost" data-ck="cfg">${config?"Guardar selección":"Configurar"}</button>
      <button class="btn sm ghost" data-ck="no">Solo necesarias</button>
      <button class="btn sm pri" data-ck="yes">Aceptar todas</button></div></div>`;
  document.body.append(d);
  d.querySelector('[data-ck="yes"]').onclick=()=>setConsent(true);
  d.querySelector('[data-ck="no"]').onclick=()=>setConsent(false);
  d.querySelector('[data-ck="cfg"]').onclick=()=>{const cfg=d.querySelector(".ckb-cfg");if(cfg.hidden){cfg.hidden=false;d.querySelector('[data-ck="cfg"]').textContent="Guardar selección";}else setConsent(d.querySelector("#ckAn").checked);};
}

let NEWS=null;
const NEWS_TAGS={nuevo:["Nuevo","ok"],mejora:["Mejora","dj"],arreglo:["Arreglo",""],aviso:["Aviso","wait"]};
function newsSeen(){try{return localStorage.getItem("cabina_news_seen")||"";}catch(_){return "";}}
function unseenNews(){const seen=newsSeen();return (NEWS||[]).filter(n=>!seen||n.published_at>seen);}
function newsBtn(){return `<button class="iconbtn newsbtn" data-news aria-label="Novedades" title="Novedades">${I("bell")}<span class="ndot" ${NEWS&&unseenNews().length?"":"hidden"}></span></button>`;}
async function loadNews(){
  if(NEWS) return NEWS;
  const {data,error}=await sb.from("announcements").select("*").order("published_at",{ascending:false}).limit(20);
  NEWS=error?[]:(data||[]); return NEWS;
}
function updateNewsBadges(){
  const n=unseenNews().length;
  $$(".ndot").forEach(d=>d.hidden=!n);
  $$(".nbadge").forEach(b=>{b.hidden=!n;b.textContent=n;});
}
async function openNews(){
  await loadNews(); const unseen=new Set(unseenNews().map(n=>n.id));
  const d=$("#newsDlg"), b=$("#newsBody");
  b.innerHTML=`<div class="dlg-h"><div><span class="lbl">Novedades de Cabina</span><h2 id="newsTitle" style="margin-top:8px">${unseen.size?`${unseen.size} ${unseen.size===1?"novedad":"novedades"} para ti`:"Lo último en Cabina"}</h2></div><button class="iconbtn" data-closen aria-label="Cerrar">${I("x")}</button></div>
    <div class="newslist">${NEWS.length?NEWS.map(n=>{const [tl,tc]=NEWS_TAGS[n.tag]||["Nuevo","ok"];return `<article class="newsitem${unseen.has(n.id)?" unseen":""}">
      <div class="newsmeta"><span class="chip ${tc}">${tl}</span><span class="calc">${new Date(n.published_at).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})}</span>${unseen.has(n.id)?`<span class="newdot">Sin leer</span>`:""}</div>
      <h3>${h(n.title)}</h3><p>${h(n.body)}</p></article>`;}).join(""):`<div class="empty">${I("bell")}<b>Todavía no hay novedades</b><span>Aquí te contaremos cada mejora de Cabina.</span></div>`}</div>
    <button class="btn pri block" data-closen>Entendido</button>`;
  $$("[data-closen]",b).forEach(x=>x.onclick=()=>d.close());
  if(!d.open) d.showModal();
}
$("#newsDlg").addEventListener("close",()=>{if(NEWS&&NEWS.length){try{localStorage.setItem("cabina_news_seen",NEWS[0].published_at);}catch(_){}}updateNewsBadges();});
document.addEventListener("click",e=>{if(e.target.closest("[data-news]")){e.preventDefault();openNews();}});

  await loadNews(); updateNewsBadges();

        <div class="seg" style="margin:0">${[["todos","Todos"],["si","Suscritos"],["no","No suscritos"]].map(([k,l])=>`<button data-af="${k}" class="${admFilter===k?"on":""}">${l}</button>`).join("")}</div>
        ${(()=>{const list=(d.recent||[]).filter(u=>admFilter==="todos"||(admFilter==="si"?u.marketing:!u.marketing));
          return list.length?`<div class="tablewrap"><table class="atable"><thead><tr><th>Usuario</th><th>Tipo</th><th>Emails</th><th>Alta</th><th>Última vez</th></tr></thead><tbody>
          ${list.map(u=>`<tr><td><a class="person" href="#perfil-${u.id}" style="color:inherit;text-decoration:none">${avatar(u)}<div><b>${h(u.display_name)}</b><small class="muted" style="display:block;font-size:12.5px">${h(u.email||"")}${u.city?" · "+h(u.city):""}</small></div></a></td>
            <td>${chip(u.role)}</td><td>${mkChip(u)}</td><td class="calc">${since(u.created_at)}</td><td class="calc">${u.last_seen?since(u.last_seen):"—"}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="muted">${admFilter==="si"?"Nadie se ha suscrito todavía.":admFilter==="no"?"Todos los usuarios están suscritos.":"Todavía no hay registros."}</p>`;})()}
      </div></div>
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
      <div class="panel"><h3>Visitantes por página</h3>${(d.visitor_pages||[]).length?d.visitor_pages.map(x=>`<div class="kv"><span>${h(x.page)}</span><b>${x.n}</b></div>`).join(""):`<p class="muted">Ningún visitante sin cuenta ahora mismo.</p>`}</div>
      <div class="panel"><h3>Usuarios por tipo</h3>${Object.keys(ROLES).map(k=>`<div class="kv"><span>${ROLES[k]}</span><b>${roles[k]||0}</b></div>`).join("")}</div>
      <div class="panel"><div class="panel-h"><h3>Suscritos a emails</h3><span class="calc" id="subN">…</span></div>
        <p class="muted" style="font-size:13.5px">Solo quienes marcaron la casilla de emails comerciales.</p>
        <button class="btn sm ghost" id="subCopy">${I("check")} Copiar emails</button></div>
      <div class="panel"><h3>Actividad</h3><div class="kv"><span>Bolos abiertos</span><b>${t.events_open||0}</b></div><div class="kv"><span>Postulaciones</span><b>${t.applications||0}</b></div><div class="kv"><span>Publicaciones</span><b>${t.posts||0}</b></div></div>
    </div></div>`;
  };
  await draw();
  const subsLoad=async()=>{const {data}=await sb.rpc("admin_subscribers");const list=data||[];const n=document.getElementById("subN");if(n)n.textContent=list.length;return list;};
  const hookSubs=()=>{const b=document.getElementById("subCopy");if(!b||b.dataset.on)return;b.dataset.on=1;subsLoad();
    b.onclick=async()=>{const list=await subsLoad();if(!list.length)return toast("Todavía no hay suscritos.",true);
      const txt=list.map(x=>x.email).join(", ");try{await navigator.clipboard.writeText(txt);toast(`${list.length} emails copiados`);}catch(_){prompt("Emails suscritos",txt);}};};
  hookSubs(); new MutationObserver(hookSubs).observe(document.getElementById("view"),{childList:true,subtree:true});
  if(adminTimer) clearInterval(adminTimer);
  adminTimer=setInterval(()=>{if(!document.hidden)draw();},5000);
}

/* ---------- Router ---------- */
async function route(){
  const raw=location.hash.slice(1)||"";
  const m=raw.match(/^([a-z-]+?)(?:-([0-9a-f]{8}-[0-9a-f-]{27}))?$/);
  let view=m?m[1]:"", id=m?m[2]:null;
  const priv=["resumen","explorar","mis-bolos","postulaciones","contratos","cobros","ajustes","publicar","comunidad"];
  if(!view||view==="inicio"||["como","bolos","precio"].includes(view)) view=me?"resumen":"inicio";
  if(priv.includes(view)&&!me){view="inicio";}
  if(view==="postulaciones"&&!isTalent()) view="resumen";
  if(view==="admin"&&!me?.admin) view=me?"resumen":"inicio";
  if(view!=="admin"&&adminTimer){clearInterval(adminTimer);adminTimer=null;}
  if(view==="cobros"&&!isTalent()) view="resumen";
  window.scrollTo(0,0);
  try{
    switch(view){
      case "inicio": return await viewLanding();
      case "resumen": return await viewResumen();
      case "explorar": return await viewExplorar();
      case "mis-bolos": return await viewMisBolos();
      case "postulaciones": return await viewPostulaciones();
      case "contratos": return await viewContratos();
      case "cobros": return await viewCobros();
      case "ajustes": return viewAjustes();
      case "publicar": return viewPublicar();
      case "talento": return await viewTalento();
      case "comunidad": return await viewComunidad();
      case "admin": return await viewAdmin();
      case "aviso-legal": case "condiciones": case "privacidad": case "cookies": return viewLegal(view);
      case "evento": return id?await viewEvento(id):go("inicio");
      case "perfil": return id?await viewPerfil(id):go("inicio");
      default: return me?viewResumen():viewLanding();
    }
  }catch(err){console.error(err);(document.getElementById("view")||root).innerHTML=`<div class="empty">${I("x")}<b>No hemos podido cargar esta página</b><span>Revisa tu conexión y vuelve a intentarlo.</span><button class="btn" onclick="route()">Reintentar</button></div>`;}
}
window.addEventListener("hashchange",route);

(async function init(){
  if(!getConsent()) setTimeout(()=>showCookieBanner(false),400);
  await loadMe();
  sb.auth.onAuthStateChange(async ev=>{if(ev==="SIGNED_OUT"){me=null;}});
  const q=new URLSearchParams(location.search);
  if(q.get("pago")==="ok"&&q.get("booking")&&me){
    try{const r=await callFn("bookings",{action:"verify",booking_id:q.get("booking")});toast(r.status==="pagado"?"Pago completado. ¡Bolo cerrado!":"Estamos confirmando el pago…");}catch(x){toast(x.message,true);}
    history.replaceState(null,"",location.pathname+location.hash);
  }else if(q.get("pago")==="cancelado"){toast("Pago cancelado. No se ha cobrado nada.",true);history.replaceState(null,"",location.pathname+location.hash);}
  setTimeout(maybeAutoNews,900); beat();
  if(RECOVERY){
    history.replaceState(null,"",location.pathname+"#resumen");
    if(me){route();reg={mode:"newpass",step:1};renderAuth();$("#authDlg").showModal();return;}
    toast("El enlace ha caducado o ya se usó. Pide uno nuevo desde «Entrar».",true);
  }
  route();
})();
</script>
